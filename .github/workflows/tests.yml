name: Tests

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches:
      - '*'

jobs:
  xcode_tests:
    name: ${{ matrix.platform }} Tests (Xcode)
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        platform:
          - "OS=26.5,name=iPhone 17,platform=iOS Simulator"
    steps:
      - uses: actions/checkout@v2
      - name: Test for ${{ matrix.platform }}
        run: xcodebuild test -scheme "blue-triangle" -destination '${{ matrix.platform }}'
